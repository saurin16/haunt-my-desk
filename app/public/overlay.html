<!doctype html>
<html lang="en" class="overlay-html">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Haunt My Desk — OBS overlay</title><link rel="stylesheet" href="/assets/style.css"></head>

  <script type="module" src="/assets/overlay.js"></script>

</html>
